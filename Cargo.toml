# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-path-predicate"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-path-predicate"
description = "Predicate path technology: a boolean expression over paths another reader answers — comparisons, exists, starts-with, contains, and, or, not — so a route or a Subscription reads one truth from content, for route and process. A xmip-core-path technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The PathEngine trait lives in path; the structure
# reader it drives lives in contract.
path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }

[dev-dependencies]
# Only a test's stand-in writer needs the Stream type its finish returns.
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
